[package]
name = "hibp-bin-fetch"
version = "0.1.4"
edition = "2024"
license = "MIT"
description = "Downloads Have I Been Pwned password hashes and converts them to compact 6-byte binary format for use with hibp-verifier"
homepage = "https://github.com/PrismaPhonic/hibp-rs"
repository = "https://github.com/PrismaPhonic/hibp-rs"
readme = "README.md"
keywords = ["hibp", "password", "security", "breach", "sha1"]
categories = ["command-line-utilities", "authentication"]

[dependencies]
compact_str.workspace = true
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
indicatif = "0.17"
sha2 = "0.10"
ntex = { version = "3", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
chrono = { version = "0.4", features = ["serde"] }
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-compression = { version = "0.4.41", features = ["tokio", "zstd"] }
tokio-util = { version = "0.7.18", features = ["io"] }
async-stream = "0.3.6"
bytes = "1.11.1"
futures-util = "0.3.32"
futures-core = "0.3.32"

[features]
testing = []

[dev-dependencies]
tempfile = "3"
